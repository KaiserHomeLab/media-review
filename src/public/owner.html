<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Review · API key</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e5a00d'/><path d='M9 12h14l-7 10z' fill='%231a1a19'/></svg>" />

  <body>
    <header class="top">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>Media Review</h1>
          <div class="sub">Owner</div>
        </div>
      </a>
      <div class="top-right">
        <a class="btn small ghost" href="/">← <span class="hide-sm">Library</span></a>
      </div>
    </header>
    <main>
      <p class="notice error" id="error" hidden></p>
      <section class="card panel" id="panel" hidden>
        <h2>API key for Media Ops</h2>
        <p class="muted">
          In Media Ops, open Settings → Add app → Media Review, and enter this server's address and this key.
          Making a new key stops the old one working straight away.
        </p>
        <div class="key" id="key">No key yet.</div>
        <button class="btn primary" type="button" id="generate">Generate a new key</button>
      </section>
    </main>
