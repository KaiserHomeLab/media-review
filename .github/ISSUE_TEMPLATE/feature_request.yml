name: Feature request
description: An idea for Media Review
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: What are you or your friends trying to do, and what's missing today?
    validations:
      required: true
  - type: textarea
    id: apps
    attributes:
      label: Which apps are involved?
      description: For example Plex, Tautulli, Sonarr, Seerr, Discord.
